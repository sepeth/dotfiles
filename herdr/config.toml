onboarding = false

[ui]
sidebar_width = 16
sidebar_min_width = 13
sidebar_max_width = 20

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"], ["$jj_bookmark", "$jj_status"]]

[terminal]
default_shell = "fish"

[keys]
prefix = "ctrl+t"
previous_workspace = "prefix+p"
next_workspace = "prefix+n"
switch_workspace = "prefix+shift+1..9"
previous_tab = "prefix+comma"
next_tab = "prefix+period"
